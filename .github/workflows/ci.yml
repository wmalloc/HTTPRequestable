name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Package.swift needs swift-tools-version 6.3, so use the newest stable Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-macos-

      - name: Build
        run: swift build

      # Live API tests are skipped unless HTTPREQUESTABLE_LIVE_TESTS=1, so this needs no network.
      - name: Test
        run: swift test

      - name: Test HackerNewsKit sample
        working-directory: Sample/Modules/HackerNewsKit
        run: swift test

  sample-app:
    name: Sample app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Sample.xcodeproj is kept in the project.pbxproj format, so any Xcode 26 or later can open it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: xcodebuild -version

      - name: Build Sample app
        working-directory: Sample
        run: >
          xcodebuild build
          -project Sample.xcodeproj
          -scheme Sample
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  android:
    name: Android
    # The Android emulator needs KVM, which Ubuntu runners provide; Apple silicon macOS runners cannot run it.
    # Pinned to 24.04 because the action downloads the host toolchain for the runner's Ubuntu version, and
    # swift.org has no Swift 6.3 build for Ubuntu 26.04, which ubuntu-latest now is.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Cross-compiles the package with the Swift SDK for Android and runs its tests on an emulator.
      - name: Build and test on Android
        uses: skiptools/swift-android-action@v2
        with:
          # Quoted, because an unquoted 6.3 is read as a number and selects Swift 6.
          swift-version: '6.3'
          # Ubuntu runners are low on disk space, which stops the emulator from starting.
          free-disk-space: true

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    # The package does not build on Linux yet: it uses URLSession.AsyncBytes, which FoundationNetworking
    # does not provide. This job reports Linux problems without blocking merges; remove
    # continue-on-error once it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

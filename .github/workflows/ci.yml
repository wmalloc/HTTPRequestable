name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Package.swift needs swift-tools-version 6.3, so use the newest stable Xcode on the runner.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-macos-

      - name: Build
        run: swift build

      # Live API tests are skipped unless HTTPREQUESTABLE_LIVE_TESTS=1, so this needs no network.
      - name: Test
        run: swift test

      - name: Test HackerNewsKit sample
        working-directory: Sample/Modules/HackerNewsKit
        run: swift test

  sample-app:
    name: Sample app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # Sample.xcodeproj is kept in the project.pbxproj format, so any Xcode 26 or later can open it.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: xcodebuild -version

      - name: Build Sample app
        working-directory: Sample
        run: >
          xcodebuild build
          -project Sample.xcodeproj
          -scheme Sample
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO

  linux:
    name: Linux
    runs-on: ubuntu-latest
    container: swift:6.3
    # The package does not build on Linux yet: it uses URLSession.AsyncBytes, which FoundationNetworking
    # does not provide. This job reports Linux problems without blocking merges; remove
    # continue-on-error once it passes.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
